version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: 
      context: .
      dockerfile: DocumentManagementSystem/Dockerfile
    depends_on:
        rabbitmq:
          condition: service_healthy
        db:
          condition: service_started
        minio:
          condition: service_started
        elasticsearch:
          condition: service_started
        kibana:
          condition: service_started
    environment:
      - ConnectionStrings__MainDatabase=Host=db;Port=5432;Database=myapp;Username=user;Password=password
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__UserName=user
      - RabbitMq__Password=pass
      - RabbitMq__VirtualHost=/
    ports:
      - "8080:80"
  
  webapp:
    build:
      context: ./documentmanagementui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: npm run dev -- --host

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: pass
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  ocr:
    build:
      context: ../OCRWorker
      dockerfile: OCRWorker/Dockerfile
    container_name: ocrworker
    depends_on:
        rabbitmq:
          condition: service_healthy
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: user
      RabbitMq__Password: pass
      RabbitMq__VirtualHost: /

  ai-runner:
    provider:
      type: model
      options:
        model: ai/smollm2

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: abcd
      MINIO_ROOT_PASSWORD: abcd2345
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"


volumes:
  pgdata:
  rabbitmq_data:
  minio_data:
